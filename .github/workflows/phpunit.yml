name: PHPUnit

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        wp: ['latest']
        include:
          # The "Requires PHP" / "Requires at least" pair from readme.txt.
          - php: '7.4'
            wp: '5.9'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer
      # bin/install-wp-tests.sh checks out the WordPress test library with svn.
      # The runner image also lists packages.microsoft.com as an apt source. When that repository
      # answers 403, `apt-get update` fails before any test runs. Subversion comes from the Ubuntu
      # archive, so drop the Microsoft sources first.
      - run: |
          sudo find /etc/apt/sources.list.d -type f -exec grep -q 'packages.microsoft.com' {} \; -print -delete
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
      - run: composer install --no-interaction --no-progress
      - run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}
      - run: vendor/bin/phpunit
